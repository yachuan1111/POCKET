<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no">
<title>POCKET — 杂志风小手机</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap">
<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--mut:#9a9a9a;--ln:rgba(26,26,26,.13);--soft:#f3f3f3;--sms:#e9e9eb;--serif:"Cormorant Garamond","Noto Serif SC","Songti SC",Georgia,serif;--mono:"Jost","PingFang SC",system-ui,sans-serif;--sys:-apple-system,"SF Pro Text",system-ui,sans-serif;--ez:cubic-bezier(.22,.8,.2,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--fg:#f2f2f2;--mut:#85837d;--ln:rgba(236,235,230,.16);--soft:#171717;--sms:#26262a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0f;--fg:#ecebe6;--mut:#85837d;--ln:rgba(236,235,230,.16);--soft:#171717;--sms:#26262a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{height:100%;display:grid;place-items:center;background:var(--soft);font-family:var(--serif);font-weight:300}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font:400 9.5px var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--mut)}
#ph{position:relative;width:min(390px,100%);height:min(820px,100%);background:var(--bg);color:var(--fg);overflow:hidden;border:1px solid var(--ln);border-radius:48px;box-shadow:0 50px 120px -40px rgba(0,0,0,.3)}
@media(max-width:480px){#ph{border:0;border-radius:0;width:100%;height:100%;box-shadow:none}}
#sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px;font:400 11px var(--mono);letter-spacing:.08em;z-index:70;pointer-events:none}
#sb span{display:flex;gap:6px;align-items:center}
#sb svg{width:18px;height:12px;fill:currentColor}
.app{position:absolute;inset:0;padding-top:44px;display:none;flex-direction:column;background:var(--bg)}
.app.on{display:flex;animation:appIn 1.1s var(--ez)}
@keyframes appIn{from{opacity:0;filter:blur(8px);transform:scale(1.025)}to{opacity:1;filter:none;transform:none}}
.scroll{flex:1;overflow:auto;padding:14px 32px 120px}
#hi{position:absolute;bottom:8px;left:50%;width:120px;height:4px;margin-left:-60px;background:var(--fg);opacity:.85;border-radius:3px;z-index:75;cursor:pointer}
hr.k{border:0;border-top:1px solid var(--ln);margin:16px 0}
h1.clk{font:300 104px/.9 var(--serif);letter-spacing:-.03em;margin-top:56px}
#dt{letter-spacing:.3em!important}
.grid{display:flex;justify-content:space-between;margin-top:110px}
.ap{display:flex;flex-direction:column;align-items:center;gap:16px;width:84px;text-align:center}
.ap>.mono{display:none}
.ap svg.i{width:68px;height:68px;padding:21px;border:1px solid var(--ln);border-radius:50%;transition:background .7s var(--ez),color .7s var(--ez),transform .7s var(--ez),border-color .7s}
.ap:hover svg.i,.ap:active svg.i{background:var(--fg);color:var(--bg);border-color:var(--fg);transform:translateY(-4px)}
.ap b{font:400 11px var(--mono);letter-spacing:.3em;display:block}
.ap em{font:300 14px var(--serif);font-style:italic;color:var(--mut);display:block;margin-top:2px;letter-spacing:.04em;text-transform:capitalize}
.vert{position:absolute;right:14px;top:130px;writing-mode:vertical-rl;font:400 8.5px var(--mono);letter-spacing:.5em;color:var(--mut)}
.quote{margin-top:70px;font:italic 300 26px/1.3 var(--serif);text-align:center}
.quote .mono{display:block;margin-top:14px}
#sp{position:absolute;inset:0;background:var(--bg);color:var(--fg);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center}
#sp.on{display:flex}
#sp.out{opacity:0;transition:opacity 1s var(--ez);pointer-events:none}
#sp svg{width:46px;height:46px;stroke-width:.8;animation:fi 1.4s both}
#sp .n{font:400 9.5px var(--mono);letter-spacing:.5em;color:var(--mut);margin-top:30px;animation:fi 1.4s .2s both}
#sp .t{font:300 54px/1.1 var(--serif);letter-spacing:.14em;display:flex;margin-top:26px}
#sp .t span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(10px);animation:rise 1.2s var(--ez) forwards}
#sp .ln{height:1px;background:var(--fg);width:0;margin-top:34px;animation:ln 1.6s .3s var(--ez) forwards}
@keyframes rise{to{opacity:1;filter:none;transform:none}}
@keyframes ln{to{width:120px}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.hd{padding:6px 0 2px;position:relative}
.hd h2,h2.big{font:300 50px/1.05 var(--serif);letter-spacing:-.01em}
h2.big i{font-style:italic;font-weight:300}
.hd button.pl{position:absolute;right:0;bottom:10px;width:44px;height:44px;border:1px solid var(--ln);border-radius:50%;display:grid;place-items:center;transition:.6s var(--ez)}
.hd button.pl:active,.hd button.pl:hover{background:var(--fg);color:var(--bg)}
.f{display:block;margin-top:30px}
.f .mono{display:block;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:0;border-bottom:1px solid var(--ln);background:transparent;padding:10px 0;font-size:16px;font-weight:300;outline:0;border-radius:0;resize:none;transition:border-color .6s;appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--fg)}
.f select option{color:#000}
.cd{display:flex;gap:14px;align-items:flex-end}
.bt{border:1px solid var(--ln);border-radius:999px;padding:12px 20px;font:400 10px var(--mono);letter-spacing:.22em;transition:.6s var(--ez);white-space:nowrap}
.bt:hover,.bt:active,.bt.k{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bt:disabled{opacity:.35}
.bt.w{display:block;width:100%;margin-top:40px;padding:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.tabs{display:flex;border:1px solid var(--ln);border-radius:999px;overflow:hidden;margin-top:20px}
.tabs button{flex:1;padding:11px 0;font:400 10px var(--mono);letter-spacing:.14em;transition:.6s var(--ez)}
.tabs .a{background:var(--fg);color:var(--bg)}
.tr{display:flex;justify-content:space-between;align-items:center;margin-top:28px;font-size:17px}
.tg{width:46px;height:26px;border:1px solid var(--ln);border-radius:13px;position:relative;transition:.6s var(--ez)}
.tg i{position:absolute;top:4px;left:4px;width:16px;height:16px;background:var(--fg);border-radius:50%;transition:.6s var(--ez)}
.tg.on{background:var(--fg)}.tg.on i{left:24px;background:var(--bg)}
input[type=range]{accent-color:var(--fg);border:0!important;padding:0!important}
.av{display:flex;flex-direction:column;align-items:center;gap:10px;margin:34px 0 6px;cursor:pointer}
.av>span{width:100px;height:100px;border:1px solid var(--ln);border-radius:50%;display:grid;place-items:center;overflow:hidden;color:var(--mut)}
.av img,.avt img{width:100%;height:100%;object-fit:cover}
.avt{width:48px;height:48px;border-radius:50%;background:var(--soft);border:1px solid var(--ln);color:var(--fg);display:grid;place-items:center;font:300 24px var(--serif);overflow:hidden;flex:none}
.li{display:flex;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.li div{flex:1;min-width:0}.li b{display:block;font-size:18px;font-weight:400}
.li small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.empty{margin-top:70px;font:italic 300 26px/1.4 var(--serif);color:var(--mut)}
#nv{position:absolute;bottom:0;left:0;right:0;height:88px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln);background:var(--bg);padding-bottom:18px;z-index:10}
#nv button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--mut);transition:color .8s var(--ez)}
#nv button .mono{display:none}
#nv button svg.i{width:21px;height:21px;transition:transform .8s var(--ez)}
#nv b{font:400 9px var(--mono);letter-spacing:.3em;text-indent:.3em}
#nv button.a{color:var(--fg)}#nv button.a svg.i{transform:translateY(-3px)}
#nvb{position:absolute;top:-1px;height:1px;bottom:auto;left:0;width:25%;transition:transform .9s var(--ez)}
#nvb::after{content:"";position:absolute;left:50%;margin-left:-16px;width:32px;height:1px;background:var(--fg)}
#wxo,#sheet{position:absolute;inset:0;padding-top:44px;background:var(--bg);display:none;flex-direction:column;z-index:20}
#wxo.on{display:flex;animation:sl .9s var(--ez)}
@keyframes sl{from{opacity:0;transform:translateX(40px)}}
#sheet{top:auto;height:80%;padding:34px 32px;border-top:1px solid var(--ln);border-radius:32px 32px 0 0;box-shadow:0 -30px 80px -30px rgba(0,0,0,.25);z-index:30;overflow:auto;transform:translateY(105%);display:flex;transition:transform .9s var(--ez)}
#sheet.on{transform:none}
.chh{display:flex;align-items:center;gap:12px;padding:6px 18px 14px;border-bottom:1px solid var(--ln)}
.chh div{display:flex;flex-direction:column;gap:3px}
.msgs{flex:1;overflow:auto;padding:22px 22px;display:flex;flex-direction:column;gap:12px}
.m{max-width:78%;padding:12px 17px;font-size:15px;line-height:1.55;border:1px solid var(--ln);border-radius:20px 20px 20px 6px;white-space:pre-wrap;align-self:flex-start}
@keyframes mi{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.m.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-color:var(--fg);border-radius:20px 20px 6px 20px}
.inp{display:flex;align-items:center;border-top:1px solid var(--ln);padding:8px 14px 30px 20px}
.inp input{flex:1;border:0;background:transparent;padding:14px 0;font-size:16px;font-weight:300;outline:0}
.inp button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg)}
.dr{display:flex;gap:18px;align-items:center;padding:22px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.dr .mono{width:auto}.dr b{flex:1;font-weight:300;font-size:22px}
#a-sms{font-family:var(--sys);font-weight:400}
#a-sms .scroll{padding:0 0 90px}
.sh{display:flex;justify-content:space-between;padding:8px 18px;font-size:17px}
.stt{font-size:34px;font-weight:700;padding:2px 18px 6px}
.srch{margin:6px 16px 8px;background:var(--sms);border-radius:10px;padding:8px 10px;display:flex;gap:6px;color:var(--mut);font-size:17px}
.srch svg{width:18px;height:18px;stroke-width:1.6}
.sr{display:flex;gap:10px;padding:0 0 0 16px;align-items:center;width:100%;text-align:left}
.sr .ci{width:46px;height:46px;border-radius:50%;background:var(--sms);display:grid;place-items:center;color:var(--mut);flex:none}
.sr .bd{flex:1;min-width:0;padding:11px 14px 11px 0;border-bottom:.5px solid var(--ln);position:relative}
.sr b{font-size:16px;font-weight:600;display:block}
.sr small{display:block;font-size:14px;color:var(--mut);line-height:1.3;max-height:2.6em;overflow:hidden;margin-top:1px;padding-right:20px}
.sr .tm{position:absolute;right:14px;top:12px;font-size:14px;color:var(--mut)}
.sd{display:flex;align-items:center;justify-content:space-between;padding:0 12px 6px;border-bottom:.5px solid var(--ln);font-size:17px}
.sd .c{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.sd .c i{width:36px;height:36px;border-radius:50%;background:var(--sms);display:grid;place-items:center;color:var(--mut)}
.sd .c i svg{width:20px;height:20px;stroke-width:1.6}
.sm{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column}
.sm .ts{align-self:center;font-size:11px;color:var(--mut);margin:8px 0;text-align:center}
.b{position:relative;align-self:flex-start;max-width:74%;background:var(--sms);padding:8px 13px;border-radius:18px;font-size:16px;line-height:1.3;margin-bottom:3px}
.b.last{margin-bottom:8px}
.b.last::before{content:"";position:absolute;left:-6px;bottom:0;width:14px;height:16px;background:var(--sms);border-bottom-right-radius:14px}
.b.last::after{content:"";position:absolute;left:-9px;bottom:0;width:9px;height:16px;background:var(--bg);border-bottom-right-radius:10px}
.sf{display:flex;gap:8px;align-items:center;padding:8px 12px 28px}
.sf .pc{width:32px;height:32px;border-radius:50%;background:var(--sms);display:grid;place-items:center;color:var(--mut)}
.sf .pc svg{stroke-width:1.6}
.sf .pill{flex:1;border:.5px solid var(--mut);border-radius:18px;padding:6px 12px;font-size:16px;color:var(--mut)}
#bn{position:absolute;top:8px;left:10px;right:10px;z-index:90;background:var(--sms);color:var(--fg);border-radius:24px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 16px 40px -10px #0004;transform:translateY(-170%);transition:transform .9s var(--ez);font-family:var(--sys);font-weight:400;text-align:left;width:calc(100% - 20px)}
#bn.on{transform:none}
#bn i{width:38px;height:38px;border-radius:9px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
#bn i svg{stroke-width:1.4}
#bn div{flex:1;min-width:0}#bn b{font-size:14px}#bn small{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bn em{font-size:11px;opacity:.5;font-style:normal;align-self:flex-start}
#toast{position:absolute;bottom:108px;left:50%;transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:12px 22px;border-radius:999px;font:400 10.5px var(--mono);letter-spacing:.14em;opacity:0;transition:.7s var(--ez);z-index:95;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tsl{align-self:center;font:400 9.5px var(--mono);letter-spacing:.3em;color:var(--mut);margin:6px 0}
.m{cursor:pointer}.m.in{animation:mi .8s var(--ez)}
.m.ty{display:flex;gap:5px;padding:16px 18px}
.ty i{width:5px;height:5px;border-radius:50%;background:var(--mut);animation:dt 1.3s infinite}
.ty i:nth-child(2){animation-delay:.18s}.ty i:nth-child(3){animation-delay:.36s}
@keyframes dt{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ma{display:flex;gap:6px;margin:-4px 0 2px;animation:mi .5s var(--ez)}.ma.u{align-self:flex-end}.ma.a{align-self:flex-start}
.ma button{display:flex;align-items:center;gap:5px;border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font:400 10px var(--mono);letter-spacing:.14em;color:var(--mut)}
.ma svg.i{width:13px;height:13px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px}#chips:empty{display:none}
#chips button{border:1px solid var(--ln);border-radius:999px;padding:9px 15px;font-size:14px;white-space:nowrap;transition:.5s var(--ez)}#chips button:active{background:var(--fg);color:var(--bg)}
.inp .gh{background:transparent;color:var(--fg);border:1px solid var(--ln);width:38px;height:38px;margin-right:10px}
.bdg{min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font:400 11px var(--mono);display:grid;place-items:center;padding:0 6px}
.scroll{padding-bottom:130px}
#nv{left:22px;right:22px;bottom:30px;height:64px;border:1px solid var(--ln);border-radius:32px;padding:6px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 18px 50px -14px rgba(0,0,0,.28);animation:cap 1.2s var(--ez) .2s both}
@keyframes cap{from{opacity:0;transform:translateY(40px) scale(.94)}}
#nv button{border-radius:26px;gap:4px}
#nv button svg.i{width:20px;height:20px}
#nv button.a svg.i{transform:none}
#nv b{font-size:8.5px}
#nvb{top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);height:auto;border-radius:26px;background:var(--fg);transition:transform .8s var(--ez)}
#nvb::after{display:none}
#wxp{position:absolute;inset:0;padding-top:44px;background:var(--bg);display:none;flex-direction:column;z-index:25}
#wxp.on{display:flex}#wxp.in{animation:sl .9s var(--ez)}
.pt{flex:1;text-align:center;font:300 22px var(--serif)}
#sheet.s{height:auto}
.m{font-size:var(--fs,15px)}
.sec{margin:24px 0 2px}
.sb2{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:999px;padding:0 16px;margin:14px 0 4px}
.sb2 input{flex:1;border:0;background:transparent;padding:12px 0;outline:0;font-size:15px;font-weight:300}
.sb2 svg{width:16px;height:16px;color:var(--mut)}
.li.pin{background:linear-gradient(90deg,var(--soft),transparent)}
.dotm{width:8px;height:8px;border-radius:50%;background:var(--mut)}
@keyframes fl{from{background:var(--soft)}}
.flash{animation:fl 2.4s var(--ez)}
.f[data-af]::after{content:"已从信息自动填充";display:block;margin-top:6px;font:400 9px var(--mono);letter-spacing:.22em;color:var(--mut)}
#a-set>.scroll>h2.big,#a-wx>.scroll>h2.big,#wxc .hd h2,#a-sms .stt{cursor:pointer;transition:opacity .4s}
#a-set>.scroll>h2.big:active,#a-wx>.scroll>h2.big:active,#wxc .hd h2:active,#a-sms .stt:active{opacity:.35}
#a-set>.scroll>h2.big::after,#a-wx>.scroll>h2.big::after,#wxc .hd h2::after,#a-sms .stt::after{content:"HOME";font:400 8px var(--mono);letter-spacing:.3em;color:var(--mut);margin-left:12px;vertical-align:super;font-style:normal}
.scroll.pgin{animation:sl .9s var(--ez)}
.card{margin:22px 0 6px;padding:22px 24px;border:1px solid var(--ln);border-radius:26px}
.card b{display:block;font:300 28px/1.2 var(--serif);margin:8px 0 6px;word-break:break-all}
.lb{display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}
.lb div{flex:1;min-width:0}.lb b{display:block;font-size:17px;font-weight:400}
.lb small{display:block;color:var(--mut);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln);margin-top:18px}
.sg div{padding:20px 0;border-bottom:1px solid var(--ln)}
.sg b{display:block;font:300 42px/1 var(--serif);margin-bottom:8px}
.calm *{animation-duration:.01s!important;transition-duration:.01s!important}

:root{--px:max(18px,calc((100% - 560px)/2));--pill:#141414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:#2c2c2e}}
:root[data-theme="dark"]{--pill:#2c2c2e}
html,body{background:var(--bg)}
#ph{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
svg.i{width:18px;height:18px}
.mono{font-size:8.5px;letter-spacing:.26em}
#sb{height:30px;padding:0 16px 5px;font-size:10px;pointer-events:auto;cursor:pointer}
#sb svg{width:15px;height:10px}
.app{padding-top:30px}
#wxo,#wxp,#sheet{padding-top:30px}
#sheet{padding:22px var(--px);height:76%}
.scroll{padding:8px var(--px) 104px}
hr.k{margin:10px 0}
.hd h2,h2.big{font-size:30px}
.hd{padding:2px 0}
.hd button.pl{width:34px;height:34px;bottom:6px}
.f{margin-top:18px}.f input,.f select,.f textarea{font-size:14px;padding:7px 0}
.bt{padding:8px 14px;font-size:9px}.bt.w{margin-top:24px;padding:13px}
.row{margin-top:16px;gap:8px}
.tabs{margin-top:12px}.tabs button{padding:8px 0;font-size:9px}
.tr{margin-top:16px;font-size:14px}
.tg{width:38px;height:22px;border-radius:11px}.tg i{top:3px;left:3px;width:14px;height:14px}.tg.on i{left:19px}
.av{margin:18px 0 4px}.av>span{width:72px;height:72px}

  if(a.type=='gemini')u=`${b}/v1beta/models?key=${a.key}`;
  else if(a.type=='anthropic'){u=b+(a.raw?'':'/v1')+'/models';h={'x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}}
  else{u=b+'/models';h={Authorization:'Bearer '+a.key}}
  const r=await fetch(u,{headers:h});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();
  a.models=(j.data||j.models||[]).map(m=>String(m.id||m.name||'').replace('models/',''));if(!a.model||!a.models.includes(a.model))a.model=a.models[0]||'';
  save();renderSet();toast('已拉取 '+a.models.length+' 个模型')}catch(e){toast('拉取失败：'+e.message)}}
async function ask(a,sys,ms,sig,onTok){const b=URLS(a);let u,hd={'Content-Type':'application/json'},body;
  if(a.type=='anthropic'){u=b+(a.raw?'':'/v1')+'/messages';Object.assign(hd,{'x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});body={model:a.model,max_tokens:1024,system:sys,messages:ms,temperature:Math.min(a.temp,1),stream:!!onTok}}
  else if(a.type=='gemini'){u=`${b}/v1beta/models/${a.model}:generateContent?key=${a.key}`;body={systemInstruction:{parts:[{text:sys}]},contents:ms.map(m=>({role:m.role=='user'?'user':'model',parts:[{text:m.content}]})),generationConfig:{temperature:a.temp}}}
  else{u=b+'/chat/completions';hd.Authorization='Bearer '+a.key;body={model:a.model,messages:[{role:'system',content:sys},...ms],temperature:a.temp,stream:!!onTok};if(a.effort!='off')body.reasoning_effort=a.effort}
  if(a.type=='gemini'){body.generationConfig.maxOutputTokens=D.cfg.maxTok;if(D.cfg.topP<1)body.generationConfig.topP=D.cfg.topP}else{if(a.type=='anthropic')body.max_tokens=D.cfg.maxTok;else body.max_tokens=D.cfg.maxTok;if(D.cfg.topP<1)body.top_p=D.cfg.topP}
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),(D.cfg.timeout||60)*1000);if(sig)sig.addEventListener('abort',()=>ac.abort());
  let r;try{r=await fetch(u,{method:'POST',headers:hd,body:JSON.stringify(body),signal:ac.signal})}catch(e){if(ac.signal.aborted&&!(sig&&sig.aborted))throw Error('请求超时');throw e}finally{clearTimeout(to)}
  if(!r.ok)throw Error('HTTP '+r.status);
  if(onTok){const rd=r.body.getReader(),dc=new TextDecoder();let buf='',out='';
   for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(l.indexOf('data:')!==0)continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
     try{const j=JSON.parse(d);const x=a.type=='anthropic'?(j.delta&&j.delta.text)||'':(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';if(x){out+=x;onTok(out)}}catch(e){}}}
   if(!out)throw Error('empty stream');return out}
  const j=await r.json();
  return a.type=='anthropic'?j.content.map(c=>c.text||'').join(''):a.type=='gemini'?j.candidates[0].content.parts.map(p=>p.text).join(''):j.choices[0].message.content}

 tgo:()=>{if(tmr.run){tmr.left=Math.max(0,tmr.end-Date.now());tmr.run=0}else{if(!tmr.left){const m=+($('#tm')||{}).value||0,s=+($('#ts')||{}).value||0;tmr.left=(m*60+s)*1000;tmr.tot=m*60+s}if(!tmr.left)return toast('请设置时间');tmr.end=Date.now()+tmr.left;tmr.run=1}renderClk()},
 trs2:()=>{tmr={end:0,left:0,tot:0,run:0};renderClk()},
 swg:()=>{if(sw.run){sw.acc+=Date.now()-sw.t0;sw.run=0}else{sw.t0=Date.now();sw.run=1}renderClk()},
 swl:()=>{const ms=sw.acc+(sw.run?Date.now()-sw.t0:0);if(ms)sw.laps.unshift(fSw(ms));renderClk()},swr:()=>{sw={t0:0,acc:0,run:0,laps:[]};renderClk()},
 nxt:k=>{const c=ac();if(!nxMaster){nxMaster=c.createGain();nxMaster.connect(c.destination);nxMaster.gain.value=nxVol}if(nxOn[k]){nxOn[k].stop();delete nxOn[k]}else{const r=SND[k].mk(c);r.out.connect(nxMaster);nxOn[k]=r}renderNox()},
 nxs:x=>{nxLeft=+x?Date.now()+(+x)*60000:0;toast(+x?'已设置 '+x+' 分钟睡眠定时':'已关闭定时');renderNox()},
 nxb:()=>{nxBr=nxBr?0:1;renderNox();if(nxBr)setTimeout(()=>brLoop(0),60)},
 tdraw:async()=>{const q=($('#tq')||{}).value||'',i=Math.random()*22|0,rev=Math.random()<.3;tar={i,rev,q,text:''};D.tar.unshift({t:Date.now(),i,rev,q});save();renderTar();
  let tx;try{tx=(await ask(D.main,'你是温和克制的塔罗解读者，语言简短诗意，不做绝对预言。',[{role:'user',content:'我抽到了「'+ARC[i][0]+(rev?'（逆位）':'（正位）')+'」。'+(q?'我的问题是：'+q+'。':'')+'请用 80 字以内给出解读与一句温柔的建议。'}])).trim()}catch(e){tx='牌意：'+ARC[i][rev?2:1]+'。慢下来，听听内心的声音。'}
  tar.text=tx;if($('#tx'))$('#tx').textContent=tx},
 mpost:()=>{const x=$('#mox').value.trim();if(!x)return toast('写点什么');const p={id:'p'+Date.now(),who:'me',t:Date.now(),x,likes:[],cm:[]};D.mo.push(p);save();renderPg(0);D.friends.slice(0,3).forEach((f,k)=>setTimeout(()=>cmt(f,p),2000+k*2400))},
 mgen:async()=>{if(!D.friends.length)return toast('先去通讯录添加好友');toast('正在刷新…');await Promise.all(D.friends.slice(0,4).map(async f=>{let x;try{x=(await ask(D.main,sysP(f),[{role:'user',content:'请以你的角色身份发一条朋友圈，不超过 40 字，只输出正文。'}])).trim()}catch(e){x=FP[Math.random()*FP.length|0]}D.mo.push({id:'p'+Date.now()+Math.random(),who:f.id,t:Date.now()-Math.random()*36e5,x,likes:[],cm:[]})}));save();mrefresh()},
 mlk:x=>{const p=D.mo.find(v=>v.id==x),i=p.likes.indexOf('我');i<0?p.likes.push('我'):p.likes.splice(i,1);save();mrefresh()},
 mcm:x=>{mcOpen=mcOpen==x?null:x;mrefresh()},
 mcs:x=>{const v=$('#mci').value.trim();if(!v)return;D.mo.find(p=>p.id==x).cm.push({n:D.me.id,x:v});mcOpen=null;save();mrefresh()},
 mdl:x=>{D.mo=D.mo.filter(p=>p.id!=x);save();mrefresh()}
});
setInterval(alarmChk,1000);setInterval(clkLoop,200);
let lpT,lpF=0;
ph.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-lp]');if(!t)return;lpF=0;lpT=setTimeout(()=>{lpF=1;rowMenu(+t.dataset.lp)},550)});
['pointerup','pointermove','pointercancel','pointerleave'].forEach(n=>ph.addEventListener(n,()=>clearTimeout(lpT)));
ph.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-lp]');if(t){e.preventDefault();rowMenu(+t.dataset.lp)}});
applySet();
ph.addEventListener('click',e=>{if(e.target.closest('#a-set>.scroll>h2.big,#a-wx>.scroll>h2.big,#wxc .hd h2,#a-sms .stt,#a-sky .tt,#a-nt .tt,#a-ai .tt,#a-clk .tt,#a-nox .tt,#a-tar .tt'))ACT.home()});
</script>
